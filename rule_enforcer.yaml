---
rules:
  STY-RUST-001:
    # The number of single-call helpers the tree may hold: a production function
    # whose name is called exactly once. Adding one is a reviewed decision — inline
    # it, or raise this budget in the same change.
    # Raised from 67 when the REST handler endpoint tests were removed: the count
    # is textual across `src` (test code included), and those tests supplied call
    # sites for handler and router helpers that production still calls once.
    # Raised from 71 for the shared `JsonObject` request-body extractor's
    # `FromRequest::from_request`, which the framework calls rather than a
    # textual call site (API-045 request-body hardening).
    # Raised from 72 when origin/main's complete-upload lifecycle merged in: its
    # new helpers lost the textual call sites the removed REST endpoint tests
    # used to supply.
    # Raised from 75 when the asset-access module was deleted: the owning resource
    # now travels with the file, and `ProtectedResource::reference` is the single
    # accessor the authorization decision reads it through.
    # Lowered to 62 after a sweep inlined the gratuitous one-call helpers, moved
    # the two test-only ones under `#[cfg(test)] mod tests`, and fixed the check's
    # accounting: it now skips the declaration line by position, so a generic
    # declaration is no longer subtracted as if it were a call site and a generic
    # helper with a single caller is counted.
    # Lowered to 55 when the security-event catalog was inlined: its constructors
    # were single-call helpers, and the module that held them is gone. Raised to
    # 66 for the resource-and-grant models and the application authorizer, whose
    # accessors each have one caller by design. Raised to 78 for the permission
    # API: its boundary parsers, wire projections and per-use-case readers each
    # have one caller by construction.
    max_single_call_functions: 82
  STY-RUST-002:
    bounded_contexts: &bounded_contexts
      - asset
      - identity
      - library
      - user
  STY-RUST-075:
    allowed_crates:
      - anyhow
      - chrono
      - tracing
  STY-RUST-083:
    bounded_contexts: *bounded_contexts
  STY-SQL-006:
    singular_exceptions:
      - series
  STY-SQL-009:
    allowed_foreign_keys:
      - movie::cover_image_id->image(image_id)
      - series::cover_image_id->image(image_id)
      - season::cover_image_id->image(image_id)
      - music_album::cover_image_id->image(image_id)
      - music_group::cover_image_id->image(image_id)
      - music_playlist::cover_image_id->image(image_id)
      - resource::owner_id->user(user_id)
      - resource::auth_parent_id->resource(resource_id)
      - resource_relation::from_resource_id->resource(resource_id)
      - resource_relation::to_resource_id->resource(resource_id)
  TEST-002:
    exempt_traits:
      - AssetUnitOfWork
      - IdentityUnitOfWork
      - LibraryUnitOfWork
      - UnitOfWork
      - UnitOfWorkFactory
      - UserUnitOfWork
  OBS-003:
    denied_values:
      - err
      - error
      - rejection
      - failure
      - cause
      - exception
      - query
      - query_string
      - raw_query
      - uri
      - url
      - file_name
      - filename
      - body
      - request_body
      - raw_body
      - payload
  OBS-004:
    # The types § 4 names as secret-bearing, all declared in
    # src/lib/domain/model/; a rename or removal cannot silently drop one.
    secret_types:
      - InstanceState
      - Credential
    # A field name that carries a secret. A `Debug` derive prints every field,
    # and a manual `impl Debug` must not print these; compare against both.
    secret_fields:
      - pepper
      - secret
      - password_hash
      - jwt_secret
    # The types § 4 names as personal-data-bearing, all declared in
    # src/lib/domain/model/; a rename or removal cannot silently drop one.
    personal_data_types:
      - User
    # A field name that carries personal data, compared exactly as a secret
    # field is: a derived or manual `Debug` must not print it.
    personal_data_fields:
      - email
      - username
  OBS-008:
    allowed_protocols:
      - file
  TEST-027:
    # The adapter families TEST-027 names: the repository (SQLite)
    # and the configuration source. The external-services family has no
    # adapter yet (nothing raises ExternalServiceError); its path is appended
    # here when that client lands.
    adapter_surfaces:
      - src/lib/infrastructure/outbound/sqlx/*_repository.rs
      - src/lib/infrastructure/outbound/file_system/configuration_source.rs
      - src/lib/infrastructure/outbound/file_system/instance_state_store.rs

  TEST-033:
    # The surfaces whose test modules open their own `:memory:` connection: the
    # adapter family directory and the module root holding its shared fixtures.
    surfaces:
      - src/lib/infrastructure/outbound/sqlx
      - src/lib/infrastructure/outbound/sqlx.rs
  TEST-044:
    # Module roots that may declare their own inline #[cfg(test)] mod
    # test_helpers for helpers used only inside that module's subtree. The
    # crate-wide module in src/lib/lib.rs is implicit. Each entry must exist and
    # declare exactly one such module.
    module_scoped_helper_roots:
      - src/lib/infrastructure/outbound/sqlx.rs

  API-031:
    # The response bodies § HAL payload guidelines names as non-representations.
    # The token issue, the token regeneration and the liveness probe are HAL
    # representations now, so the asset content bytes are the only body outside
    # the rule: their stored media type is served whole, not as a representation.
    non_hal_bodies:
      - Vec
  API-033:
    # The root keys a HAL representation's business data must not be nested
    # under. `_embedded` is HAL's own nesting key and is governed by API-035;
    # the rest are the conventional payload-envelope keys of a REST API.
    wrapper_keys:
      - data
      - payload
      - body
      - result
      - resource
  API-035:
    # A HAL payload must not use `_embedded` except where a proven performance
    # need is recorded here. HAL nests a representation's related resources
    # under it, and this API exposes them through `_links` (API-034) — except
    # the catalog collections, whose partial page items spare one request per
    # item. A location is the enclosing `<file>::<struct>` (a representation) or
    # `<file>::<function>` (a handler that builds a payload). Empty by default,
    # so every other use is reported until its need is reviewed and recorded.
    allowed_locations:
      - src/lib/infrastructure/inbound/rest/handler/library.rs::AlbumListResponse
      - src/lib/infrastructure/inbound/rest/handler/library.rs::MovieListResponse
      - src/lib/infrastructure/inbound/rest/handler/library.rs::SeriesListResponse
      - src/lib/infrastructure/inbound/rest/handler/library.rs::MusicGroupListResponse
  GOV-001:
    # Tracked paths exempt from the scope mapping, matched as shell globs. The
    # OpenSpec workflow tree holds planning artifacts (change proposals, specs)
    # that belong to no repository area, so no scope owns it. Read by
    # script/check_scopes.sh; an entry that matches no tracked path is reported.
    ignore_paths:
      - "openspec/**"

  STY-RUST-086:
    technology_nouns:
      - SHA[0-9]*
      - MD5
      - BLAKE[0-9]*
      - FFPROBE
      - SQLITE[0-9]*
      - JWT
      - ARGON[0-9]*
      - ENVY
    noun_exempt_files:
      - src/lib/domain/model/configuration.rs
    duplicate_threshold: 3
    unit_suffixes:
      - LENGTH
      - BYTES
      - SECONDS
      - MILLISECONDS
    qualifier_prefixes:
      - DEFAULT
      - MAX
      - MIN

  STY-RUST-089:
    # Import merging is enforced at zero: no two adjacent `use` declarations
    # share a parent module. A new pair fails the gate.
    max_unmerged_imports: 0
