# The hook drops cases whose generated header name is not a valid HTTP token.
hooks = "test/api/hooks.py"

# Schemathesis 4.x auto-detects a sign-up flow from `post_register` and
# `post_login` in the served OpenAPI document. `POST /api/v1/identity/register`
# is authenticated, so a bootstrapped sign-up can never succeed, and its `$ref`
# request body makes the detector raise `StopIteration`.
[auth]
auto-signup = false

# The HTTP/1 parser answers `414` before the router runs when a query string
# pushes the request line past its 64 KiB buffer. The served document declares
# that status on every operation, and both data checks accept it: it is a
# refusal of the data rather than an acceptance or a server error.
[checks.negative_data_rejection]
expected-statuses = [
  "400",
  "401",
  "403",
  "404",
  "405",
  "406",
  "409",
  "414",
  "415",
  "422",
  "428",
  "429",
  "5xx",
]

[checks.positive_data_acceptance]
expected-statuses = [
  "2xx",
  "3xx",
  "401",
  "403",
  "404",
  "409",
  "414",
  "429",
  "5xx",
]

# Fixture catalogue for the disposable, seeded server `script/api_fuzz.sh`
# starts. The identifiers are the fixed ones `src/lib/infrastructure/seed.rs`
# and `test/api/seed/sql` create, so the fuzzer reaches existing rows instead of
# 404ing on generated identifiers.
#
# A single `[[operations]]` entry ORs its include filters, so an operation that
# shares a path with another method is selected by `include-operation-id`.

[[operations]]
include-path = "/asset/file/{file_id}"
parameters = { file_id = 9001 }

[[operations]]
include-path = "/asset/file/{file_id}/content"
parameters = { file_id = 9001, Range = "bytes=0-1" }
checks = { positive_data_acceptance = { expected-statuses = [
  200,
  206,
  304,
  416,
  401,
  403,
  404,
  503,
] } }

[[operations]]
include-operation-id = "get_image"
parameters = { image_id = 9001 }

[[operations]]
include-operation-id = "get_image_content"
parameters = { image_id = 9001, Range = "bytes=0-1" }
checks = { positive_data_acceptance = { expected-statuses = [
  200,
  206,
  304,
  416,
  401,
  403,
  404,
  503,
] } }

[[operations]]
include-operation-id = "get_image_file"
parameters = { image_id = 9001 }

[[operations]]
include-operation-id = "get_audio"
parameters = { audio_id = 9001 }

[[operations]]
include-operation-id = "get_audio_content"
parameters = { audio_id = 9001, Range = "bytes=0-1" }
checks = { positive_data_acceptance = { expected-statuses = [
  200,
  206,
  304,
  416,
  401,
  403,
  404,
  503,
] } }

[[operations]]
include-operation-id = "get_audio_file"
parameters = { audio_id = 9001 }

[[operations]]
include-operation-id = "get_video"
parameters = { video_id = 9001 }

[[operations]]
include-operation-id = "get_video_content"
parameters = { video_id = 9001, Range = "bytes=0-1" }
checks = { positive_data_acceptance = { expected-statuses = [
  200,
  206,
  304,
  416,
  401,
  403,
  404,
  503,
] } }

[[operations]]
include-operation-id = "get_video_file"
parameters = { video_id = 9001 }

# A generated login body cannot carry the fixture's credentials, so the two
# fields are pinned to the Root Admin's. The dynamic auth flow still proves the
# endpoint, and the operation's negative body surface is proved by the system
# suite rather than by a warning-suppressing run.
[[operations]]
include-operation-id = "post_login"
parameters = { "body.identifier" = "${LOGIN_USERNAME}", "body.password" = "${LOGIN_PASSWORD}" }

[[operations]]
include-operation-id = "post_upload"
parameters = { "body.content_type" = "video/mp4" }
checks = { positive_data_acceptance = { expected-statuses = [
  "2xx",
  "3xx",
  401,
  403,
  404,
  409,
  413,
  422,
  429,
] }, negative_data_rejection = { expected-statuses = [
  400,
  401,
  403,
  404,
  405,
  406,
  409,
  413,
  415,
  422,
  428,
  429,
] } }

[[operations]]
include-operation-id = "update_user"
parameters = { id = 9001 }

[[operations]]
include-operation-id = "patch_credential"
parameters = { id = 9001 }

[[operations]]
include-operation-id = "get_permission_summary"
parameters = { user_id = 9001 }
# A decision query supplies `resource_kind`, `resource_id` and `action`
# together; the query schema cannot express that dependency, so a partial one is
# a documented `400`.
checks = { positive_data_acceptance = { expected-statuses = [
  "2xx",
  "3xx",
  401,
  403,
  404,
  409,
  429,
  400,
] } }

# The permission routes address a resource by kind and identifier in the URI, so
# each one is pinned to a seeded resource. The grant fixture is seeded by
# `test/api/seed/sql/0005_resources.sql`: the share upserts the same
# (principal, resource, role) tuple, so the delete addresses a stable grant id.
[[operations]]
include-operation-id = "get_resource_permission"
parameters = { kind = "GALLERY", id = 9001 }

[[operations]]
include-operation-id = "post_permission_share"
parameters = { kind = "GALLERY", id = 9001, "body.principal.kind" = "USER", "body.principal.id" = 9002, "body.role" = "VIEWER" }
phases = { examples = { enabled = false }, coverage = { enabled = false }, stateful = { enabled = false } }
checks = { positive_data_acceptance = { expected-statuses = [
  "2xx",
  "3xx",
  401,
  403,
  404,
  409,
  429,
  422,
] } }

[[operations]]
include-operation-id = "delete_permission_share"
parameters = { kind = "GALLERY", id = 9001, grant_id = 9001 }
generation = { mode = "positive", max-examples = 1 }
phases = { examples = { enabled = false }, coverage = { enabled = false }, stateful = { enabled = false } }

# A body or query value naming a resource rather than the URI is a body value
# under `API-041`, so a missing reference is a `422`, not a `404`. The target is a
# playlist no other write mutates, and the replacement carries no grants, so it
# cannot wipe a share another operation reads. The body names no resource, but
# the generated grant set can; the mismatch warning is therefore suppressed
# rather than made meaningful by a fixture the document cannot express.
[[operations]]
include-operation-id = "put_resource_permission"
parameters = { kind = "MUSIC_PLAYLIST", id = 9002, "body.grants" = [
], "body.visibility" = "PUBLIC" }
warnings = { display = ["missing_test_data"] }
checks = { positive_data_acceptance = { expected-statuses = [
  "2xx",
  "3xx",
  401,
  403,
  404,
  409,
  429,
  422,
] } }

# The position pair is supplied together; the query schema cannot express the
# dependency between the two optional parameters, so a partial pair is a
# documented server behaviour (`422`) rather than a schema violation.
[[operations]]
include-operation-id = "identify_video_series_metadata"
parameters = { season = 1, episode = 1 }
checks = { positive_data_acceptance = { expected-statuses = [
  "2xx",
  "3xx",
  401,
  403,
  404,
  409,
  429,
  422,
] } }

[[operations]]
include-operation-id = "list_series_episodes"
parameters = { series_id = 9001, season_index = 1 }

[[operations]]
include-operation-id = "get_series_season"
parameters = { series_id = 9001, season_index = 1 }

[[operations]]
include-operation-id = "patch_series_season"
parameters = { series_id = 9001, season_index = 1 }
warnings = { display = ["missing_test_data"] }

[[operations]]
include-operation-id = "get_series_episode"
parameters = { series_id = 9001, season_index = 1, episode_index = 1 }

[[operations]]
include-operation-id = "put_series_season"
parameters = { series_id = 9001, season_index = 2 }
checks = { positive_data_acceptance = { expected-statuses = [
  "2xx",
  "3xx",
  401,
  403,
  404,
  409,
  429,
  422,
] } }

# A required body identifier must name an existing entity. The fuzzing phase
# honours the pin below; the examples and coverage phases seed the body from the
# schema's examples, so they send identifiers the fixture cannot have and are
# disabled for these operations. Video 9003 is the one seeded video no movie or
# episode owns.
[[operations]]
include-operation-id = "put_series_episode"
parameters = { series_id = 9001, season_index = 1, episode_index = 2, "body.video_id" = 9003 }
phases = { examples = { enabled = false }, coverage = { enabled = false }, stateful = { enabled = false } }
checks = { positive_data_acceptance = { expected-statuses = [
  "2xx",
  "3xx",
  401,
  403,
  404,
  409,
  429,
  422,
] } }

[[operations]]
include-operation-id = "patch_series_episode"
parameters = { series_id = 9001, season_index = 1, episode_index = 1 }

# The read and the delete address different galleries and gallery items, so
# deleting one never strands the read.
[[operations]]
include-operation-id = "get_gallery"
parameters = { id = 9001 }

# The destructive operations are one-shot: each addresses a row no other
# operation in the run reads, and exactly one positive fuzzing case addresses it.
# The examples and coverage phases send the same pinned identifier repeatedly,
# so every case after the first would be a `404` by design; the stateful phase
# repeats a deletion its own scenario already consumed (`use_after_free`).
# Deletion semantics are proved by the system suite.
[[operations]]
include-operation-id = "delete_gallery"
parameters = { id = 9002 }
generation = { mode = "positive", max-examples = 1 }
phases = { examples = { enabled = false }, coverage = { enabled = false }, stateful = { enabled = false } }

[[operations]]
include-operation-id = "get_gallery_item_list"
parameters = { id = 9001 }

[[operations]]
include-operation-id = "get_gallery_item"
parameters = { id = 9001, item_id = 9002 }

[[operations]]
include-operation-id = "delete_gallery_item"
parameters = { id = 9001, item_id = 9001 }
generation = { mode = "positive", max-examples = 1 }
phases = { examples = { enabled = false }, coverage = { enabled = false }, stateful = { enabled = false } }

# Deletion cascades across every fixture the deleted user owns, so the target
# must own none of them: bobby (9002) owns no seeded content, while alice (9001)
# owns the galleries and playlists the rest of the run reads.
[[operations]]
include-operation-id = "delete_user"
parameters = { id = 9002 }
generation = { mode = "positive", max-examples = 1 }
phases = { examples = { enabled = false }, coverage = { enabled = false }, stateful = { enabled = false } }

# A chunk write needs a body, a `Content-Range` and a `Content-Digest` that all
# agree. The generator cannot produce that triple, so a positive case is refused
# before the session is read (`422`). The system suite drives the chunk protocol
# with a coherent body; the fuzz run keeps the session create, read and complete
# operations.
[[operations]]
include-operation-id = "put_upload_chunk"
enabled = false

# Deleting the only completed fixture session would strand the completion and
# read cases that share it. The system suite covers upload deletion.
[[operations]]
include-operation-id = "delete_upload"
enabled = false

