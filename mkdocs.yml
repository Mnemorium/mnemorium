---
site_name: Mnemorium

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.sections
nav:
  - Home: index.md
  - Permissions: Permissions.md
  - Development:
      - Overview: development/Overview.md
      - Technical Design: development/TechnicalDesign.md
      - HTTP API implementation notes: development/HttpApi.md
      - Entity-relationship diagram: development/EntityRelationshipDiagram.md
      - Testing: development/Test.md
      - Dependency manifest: development/DependencyManifest.md
      - Glossary: development/Glossary.md
      - Use Cases: development/UseCases.md
      - Artifacts:
          - Requirements Traceability Coverage: development/artifacts/RequirementsTraceabilityCoverage.md

extra_css:
  - stylesheets/sidebar-toggle.css

extra_javascript:
  - javascripts/sidebar-toggle.js

plugins:
  - plantuml:
      puml_url: https://www.plantuml.com/plantuml
      theme:
        enabled: false
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
