---
# A secret never reaches a log sink.
#
# § 9.4 (Redaction) forbids logging a session identifier, access token,
# password or password material, the pepper, the signing secret or personal
# data. OBS-003 and OBS-004 police the log layer and the secret-bearing types;
# this rule catches the call site that names one.
rules:
  - id: mnemorium.rust.logging.secret-in-log
    languages: [rust]
    severity: ERROR
    message: >-
      A log call carries a secret-named value. Log the event, its stable reason
      and the actor identifier only; never the token, password, password hash,
      pepper, signing secret or provider API key (§ 9.4, OBS-004).
    metadata:
      category: security
      subcategory:
        - logging
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      confidence: HIGH
      references:
        - docs/development/TechnicalDesign.md#4-redaction
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: info!(...)
                  - pattern: warn!(...)
                  - pattern: debug!(...)
                  - pattern: error!(...)
                  - pattern: trace!(...)
              - pattern-regex: >-
                  (?i)\b(password|password_hash|token|secret|pepper|api_key|jwt_secret|credential)\s*=
          - patterns:
              - pattern-either:
                  - pattern: info!(?$VALUE, ...)
                  - pattern: warn!(?$VALUE, ...)
                  - pattern: debug!(?$VALUE, ...)
                  - pattern: error!(?$VALUE, ...)
                  - pattern: trace!(?$VALUE, ...)
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: >-
                    (?i)^(password|password_hash|token|secret|pepper|api_key|jwt_secret|credential)$
