---
# Secrets come from the OS-seeded cryptographic generator.
#
# The pepper and the signing secret are generated by `secret_generator.rs`
# from a `ChaCha20Rng` seeded through `rand::rng()` (OS entropy), and the
# initial admin password by `password_generator.rs`. `SmallRng` and the
# `fastrand`/`oorandom` families are not meant for secrets.
rules:
  - id: mnemorium.rust.crypto.weak-rng
    languages: [rust]
    severity: ERROR
    message: >-
      A non-cryptographic generator produces secret material. Seed a
      cryptographic generator from OS entropy, as `secret_generator.rs` does
      with `ChaCha20Rng::from_rng(&mut rand::rng())`.
    metadata:
      category: security
      subcategory:
        - cryptography
      cwe: "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
      confidence: HIGH
      references:
        - https://docs.rs/rand/latest/rand/rngs/struct.SmallRng.html
    patterns:
      - pattern-either:
          - pattern: 'SmallRng::from_entropy()'
          - pattern: 'SmallRng::seed_from_u64(...)'
          - pattern: 'rand::rngs::SmallRng::from_entropy()'
          - pattern: 'rand::rngs::SmallRng::seed_from_u64(...)'
          - pattern: 'fastrand::u8(...)'
          - pattern: 'fastrand::u32(...)'
          - pattern: 'fastrand::u64(...)'
          - pattern: 'fastrand::fill(...)'
          - pattern: 'oorandom::Rand64::new(...)'
