---
# A file that carries a secret is written with mode 0o600.
#
# `instance_state_store.rs` writes the site pepper and the token signing secret
# with `STATE_FILE_MODE = 0o600`; `configuration_source.rs` writes the operator
# configuration, which carries a provider API key, with
# `CONFIG_FILE_MODE = 0o644`. The rule reports the second until it is
# remediated, so it stays at WARNING; raise it to ERROR with that fix.
rules:
  - id: mnemorium.rust.secrets.secret-file-mode
    languages: [rust]
    severity: WARNING
    message: >-
      A secret-bearing file is written with a group- or world-accessible mode.
      The instance state and the operator configuration carry the pepper, the
      signing secret or a provider API key; write them with 0o600.
    metadata:
      category: security
      subcategory:
        - file-permissions
      cwe: "CWE-732: Incorrect Permission Assignment for Critical Resource"
      confidence: HIGH
      references:
        - docs/development/TechnicalDesign.md#10-security
    paths:
      include:
        - src/lib/infrastructure/outbound/file_system/configuration_source.rs
        - src/lib/infrastructure/outbound/file_system/instance_state_store.rs
    patterns:
      - pattern-either:
          - pattern: 'const $NAME: $TYPE = $MODE;'
          - pattern: 'Permissions::from_mode($MODE)'
      - metavariable-regex:
          metavariable: $MODE
          regex: '^0o[0-7]+$'
      - pattern-not: 'const $NAME: $TYPE = 0o600;'
      - pattern-not: 'Permissions::from_mode(0o600)'
