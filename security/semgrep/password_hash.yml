---
# Password material is hashed only by the Argon2 adapter.
#
# `outbound/argon2/password_hasher.rs` is the sole password-hashing
# implementation and the use cases reach it through the port. MD5 and SHA-1 are
# broken; SHA-256 over a password is fast and unsalted. SHA-256 is legitimate
# for content integrity (`sha2/content_hasher.rs`) and for the rate-limit key
# digest (`governor.rs`), so only a password-named input is reported.
rules:
  - id: mnemorium.rust.crypto.password-hash
    languages: [rust]
    severity: ERROR
    message: >-
      Password material is hashed with a fast or broken digest. Hash passwords
      only through the Argon2 adapter (`SEC-001`, `outbound/argon2`).
    metadata:
      category: security
      subcategory:
        - cryptography
      cwe: "CWE-916: Use of Password Hash With Insufficient Computational Effort"
      confidence: HIGH
      references:
        - https://docs.rs/argon2/latest/argon2/
    patterns:
      - pattern-either:
          - pattern: 'Md5::new()'
          - pattern: 'Md5::digest(...)'
          - pattern: 'md5::compute(...)'
          - pattern: 'Sha1::new()'
          - pattern: 'Sha1::digest(...)'
          - patterns:
              - pattern-either:
                  - pattern: 'Sha256::digest($INPUT)'
                  - pattern: 'Sha512::digest($INPUT)'
              - metavariable-regex:
                  metavariable: $INPUT
                  regex: '(?i).*(password|passphrase|credential).*'
