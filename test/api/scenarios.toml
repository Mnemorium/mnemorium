# Scenarios the fixture fuzz run proves.
#
# `script/api_fuzz.sh` runs Schemathesis over the served document with the checks in `test/api/checks.py`, the probe
# wrappers in `test/api/hooks.py` and the expectations in `schemathesis.toml`. None of that run is a pytest case, so
# its claims cannot be written as `@scenario` decorators; `test/util/investigation.py` reads this file instead and
# records `Evidence: API suite`.
#
# Add an entry only when a named checker fails if the rule breaks:
#
# - `valid_hal_links` (`checks.py`) — a HAL body carries `_links.self`, every link is a non-empty relative target or a
#   marked URI template, and a `4xx` envelope's `self` is the request path with the query dropped.
# - `valid_collection_links` (`checks.py`) — `search` is templated on the collection, the filters are not payload
#   fields, `self`/`next`/`prev` keep the request filters and page, and a page without `limit` holds at most 20 items.
# - `valid_embedded_payloads` (`checks.py`) — only a catalog collection embeds its items, under `_embedded.items`, each
#   item the partial representation.
# - `valid_success_responses` (`checks.py`) — a `201` carries `Location` and a `204` carries no body.
# - `valid_declared_headers` (`checks.py`) — every emitted application header is declared on its status, a `401`
#   carries the bearer challenge, a `405` keeps `Allow` and a `429` keeps `Retry-After`.
# - `valid_canonical_self` (`checks.py`) — a successful read whose path ends in the addressed numeric identifier
#   names that resource in `self`, query-free.
# - `request_body_contract_check` (`hooks.py`) — every operation with a JSON body is probed once for its `415`, `400`
#   and `422` refusals, because Schemathesis' own generation only emits well-formed JSON.
# - `undeclared_query_check` (`hooks.py`) — every operation is probed once with an undeclared query parameter, which
#   answers `400`.
# - `protected_operation_check` (`hooks.py`) — every operation declaring `bearer_auth` is probed once with no
#   credentials, which answers the `401` envelope with its bearer challenge.
# - `hypermedia_body_check` (`hooks.py`) — a request carrying `_links`/`_embedded` is decided on its business data.
# - Schemathesis `content_type_conformance` — the served media type is the one the document declares for the operation.
# - Schemathesis `negative_data_rejection` / `positive_data_acceptance` — the declared status answers a generated invalid
#   or valid value, per `expected-statuses` in `schemathesis.toml`.
#
# The value is the kind of proof, from the same closed set the `@scenario` decorator uses.

[scenarios]

# `request_body_contract_check` (`hooks.py`): every operation with a JSON body is probed once for its three refusals.
