---
name: Mnemorium Shell

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.sh'

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c  # v2
        with:
          tool: shellcheck,shfmt
      - name: ShellCheck
        run: shellcheck script/*.sh
      - name: shfmt
        run: shfmt -d script/*.sh
