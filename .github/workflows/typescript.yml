---
name: Mnemorium TypeScript

on:
  pull_request:
    branches:
      - main
    paths:
      - 'test/performance/**'
      - 'devenv.nix'
      - '.github/workflows/typescript.yml'

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  suite:
    name: Type-check and lint the performance suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      K6_ARCHIVE: xk6-subcommand-openapi_v0.1.0_linux_amd64.tar.gz
      K6_SHA256: 309a6ed0822a6afadf9a29b52c574ddbded90b74dd85f558521a713e1a181521
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: test/performance/package-lock.json
      - name: Install the suite toolchain
        run: npm ci --prefix test/performance
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          shared-key: typescript
          cache-on-failure: true
      - name: Build the seeded server
        run: cargo build --features "api-docs test-seed" --bin server
      - name: Install the pinned k6
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/${K6_ARCHIVE}" \
            "https://github.com/grafana/xk6-subcommand-openapi/releases/download/v0.1.0/${K6_ARCHIVE}"
          echo "${K6_SHA256}  ${RUNNER_TEMP}/${K6_ARCHIVE}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/k6"
          tar xzf "${RUNNER_TEMP}/${K6_ARCHIVE}" -C "${RUNNER_TEMP}/k6" --strip-components=1
          "${RUNNER_TEMP}/k6/k6" version | grep -F 'v2.3.0'
          echo "${RUNNER_TEMP}/k6" >>"${GITHUB_PATH}"
      - name: Generate the typed client
        run: |
          work="${RUNNER_TEMP}/perf-client"
          mkdir -p "${work}/media"
          # The seed reads its fixture from the working directory, so the checkout's tree is linked beside it.
          ln -sfn "${GITHUB_WORKSPACE}/test" "${work}/test"
          cp test/performance/server/config.yaml "${work}/config.yaml"
          (
            cd "${work}"
            exec env MNEMORIUM_SEED_PROFILE=api "${GITHUB_WORKSPACE}/target/debug/server"
          ) >"${work}/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            if curl -fsS --max-time 1 http://127.0.0.1:4080/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4080/doc/openapi.json -o "${work}/openapi.json"
          mkdir -p test/performance/generated
          k6 x openapi "${work}/openapi.json" -o test/performance/generated/client.gen.ts
      - name: Type-check
        working-directory: test/performance
        run: npm run typecheck
      - name: Lint
        working-directory: test/performance
        run: npm run lint
      - name: Format check
        working-directory: test/performance
        run: npm run format:check
