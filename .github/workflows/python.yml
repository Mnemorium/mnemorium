---
name: Mnemorium Python

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.py'
      - 'ruff.toml'
      - 'requirements.txt'

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # `version-file` keeps the ruff version in `requirements.txt` next to the
      # other Python pins instead of restating it here.
      - name: Ruff lint
        uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6  # v3.6.1
        with:
          version-file: requirements.txt
          args: check
      - name: Ruff format
        uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6  # v3.6.1
        with:
          version-file: requirements.txt
          args: format --check
