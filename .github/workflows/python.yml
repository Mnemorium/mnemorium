---
name: Mnemorium Python

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/python.yml'

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # `version-file` keeps the ruff version in `requirements.txt` next to the
      # other Python pins instead of restating it here.
      - name: Ruff lint
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          version-file: requirements.txt
          args: check
      - name: Ruff format
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          version-file: requirements.txt
          args: format --check

  vulture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The same interpreter and the same pins as the dev environment: the tool
      # version lives in `requirements.txt` and the scope in `[tool.vulture]`, so
      # the job restates neither. Vulture exits 3 on a finding, which fails the job.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the Python tools
        run: pip install -r requirements.txt
      - name: Vulture dead code
        run: vulture
