---
name: CD - Pre version 1.0.0

on:
  push:
    tags:
      - "v0.*"

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create ZIP
        run: |
          zip -r source-${GITHUB_REF_NAME}.zip . \
            -x ".git/*" ".github/*" "target/*" "node_modules/*" "result*"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.ref_name }}
          path: source-${{ github.ref_name }}.zip
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKER_HUB_REPOSITORY }}:${{ github.ref_name }}
