---
name: CD - Pre version 1.0.0

on:
  push:
    tags:
      - "v0.*"

permissions:
  contents: write

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify version matches tag
        run: script/version.sh check "${{ github.ref_name }}"
      - name: Create ZIP
        run: |
          zip -r source-${GITHUB_REF_NAME}.zip . \
            -x ".git/*" ".github/*" "target/*" "node_modules/*" "result*"
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: source-${{ github.ref_name }}.zip
          generate_release_notes: true
          token: ${{ secrets.GH_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKER_HUB_REPOSITORY }}:${{ github.ref_name }}
