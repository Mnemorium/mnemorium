---
name: Mnemorium Docs

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - '**/*.md'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.prettierrc'
      - '.prettierignore'
      - '.markdownlint-cli2.jsonc'
  # `merge_group` has no path filter: the queue re-runs the required checks on
  # every queued pull request, so each job gates itself on the diff instead.
  merge_group:
    types:
      - checks_requested
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Markdown changes
        id: scope
        env:
          BASE_SHA: >-
            ${{ github.event.pull_request.base.sha ||
            github.event.merge_group.base_sha }}
          HEAD_SHA: >-
            ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          changed="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          if grep -qE '\.md$|^\.prettier|^\.markdownlint-cli2\.jsonc$' <<<"${changed}"; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: "24.19.0"
      - name: Prettier format check
        if: steps.scope.outputs.run == 'true'
        run: npx --yes prettier@3.8.3 --check "**/*.md"
      - name: Markdown lint
        if: steps.scope.outputs.run == 'true'
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34  # v25.0.0
        with:
          globs: "**/*.md"

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect documentation site changes
        id: scope
        env:
          BASE_SHA: >-
            ${{ github.event.pull_request.base.sha ||
            github.event.merge_group.base_sha }}
          HEAD_SHA: >-
            ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          changed="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          if grep -qE '^(docs/|mkdocs\.yml$|requirements\.txt$)' <<<"${changed}"; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.14"
      - name: Install documentation dependencies
        if: steps.scope.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Build documentation
        if: steps.scope.outputs.run == 'true'
        run: mkdocs build --strict
