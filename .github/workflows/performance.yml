          echo "${K6_SHA256}  ${RUNNER_TEMP}/${K6_ARCHIVE}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/k6"
          tar xzf "${RUNNER_TEMP}/${K6_ARCHIVE}" -C "${RUNNER_TEMP}/k6" --strip-components=1
          "${RUNNER_TEMP}/k6/k6" version | grep -F 'v2.3.0'
          echo "${RUNNER_TEMP}/k6" >>"${GITHUB_PATH}"
      - name: Run the scenario
        env:
          REPEAT: ${{ inputs.repeat || '1' }}
        run: |
          script/performance.sh run smoke \
            --profile write \
            --repeat "${REPEAT}"
      - name: Publish the job summary
        id: report
        if: always()
        run: |
          report="$(find .artifacts/performance -name report.md -printf '%T@ %p\n' 2>/dev/null |
            sort -n | tail -n 1 | cut -d' ' -f2-)"
          if [[ -n "${report}" ]]; then
            cat "${report}" >>"${GITHUB_STEP_SUMMARY}"
            cp "${report}" .artifacts/performance/report.md
            {
              echo "path=.artifacts/performance/report.md"
              echo "body<<REPORT"
              cat "${report}"
              echo "REPORT"
            } >>"${GITHUB_OUTPUT}"
          fi
      - name: Upload the run artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: performance-smoke-write
          path: .artifacts/performance
          retention-days: 30
          if-no-files-found: warn
      - name: Mail the report
        if: always() && env.PERF_MAIL_TO != '' && steps.report.outputs.path != ''
        uses: dawidd6/action-send-mail@27bf7a883db6de205849f760badd38a1a3ce0dd0  # v24
        with:
          server_address: ${{ secrets.PERF_SMTP_SERVER }}
          server_port: ${{ secrets.PERF_SMTP_PORT }}
          username: ${{ secrets.PERF_SMTP_USERNAME }}
          password: ${{ secrets.PERF_SMTP_PASSWORD }}
          subject: "Mnemorium performance — smoke / write"
          to: ${{ env.PERF_MAIL_TO }}
          from: ${{ secrets.PERF_MAIL_FROM || 'performance@mnemorium.invalid' }}
          body: ${{ steps.report.outputs.body }}
          attachments: ${{ steps.report.outputs.path }}

  load-read:
    name: load / read
    needs: changes
    if: >-
      needs.changes.outputs.run == 'true' &&
      github.event_name == 'workflow_dispatch' && inputs.scenario == 'load' &&
      (inputs.profile == 'all' || inputs.profile == 'read')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PERF_MAIL_TO: ${{ secrets.PERF_MAIL_TO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
