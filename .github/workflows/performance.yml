          tar xzf "${RUNNER_TEMP}/${K6_ARCHIVE}" -C "${RUNNER_TEMP}/k6" --strip-components=1
          "${RUNNER_TEMP}/k6/k6" version | grep -F 'v2.3.0'
          echo "${RUNNER_TEMP}/k6" >>"${GITHUB_PATH}"
      - name: Run the scenario
        env:
          REPEAT: ${{ inputs.repeat || '1' }}
        run: |
          script/performance.sh run load \
            --profile read \
            --repeat "${REPEAT}"
      - name: Publish the job summary
        id: report
        if: always()
        run: |
          report="$(find .artifacts/performance -name report.md -printf '%T@ %p\n' 2>/dev/null |
            sort -n | tail -n 1 | cut -d' ' -f2-)"
          if [[ -n "${report}" ]]; then
