---
name: opencode-review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: npm install --global @opencode/cli
      - name: Install OpenCode plugin dependencies
        run: npm ci --prefix .opencode
      - name: Check the GitHub MCP server connection
        run: |
          output=$(opencode mcp list 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -qE 'github.*connected'; then
            exit 0
          fi
          echo "The github MCP server is not connected." >&2
          echo "On auth failure, set GITHUB_MCP_TOKEN to a PAT." >&2
          exit 1
        env:
          GITHUB_MCP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Review pull request
        run: |
          opencode run --standalone --format json \
            --agent review-orchestrator \
            --model "${{ vars.AGENT_REVIEWER_MODEL }}" \
            "Review this pull request by loading and following the
          review-pr skill.

          <pull_request>
          Number: ${{ github.event.pull_request.number }}
          URL: ${{ github.event.pull_request.html_url }}
          Owner: ${{ github.repository_owner }}
          Repository: ${{ github.event.repository.name }}
          Base Branch: ${{ github.event.pull_request.base.ref }}
          Head Branch: ${{ github.event.pull_request.head.ref }}
          </pull_request>" > events.ndjson
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_MCP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload review event log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-review-events
          path: events.ndjson
          if-no-files-found: ignore
