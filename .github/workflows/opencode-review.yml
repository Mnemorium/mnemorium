---
name: opencode-review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: npm install --global @opencode/cli
      - name: Check the GitHub MCP server connection
        env:
          GITHUB_MCP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST https://api.githubcopilot.com/mcp/ \
            -H "Authorization: Bearer $GITHUB_MCP_TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}')
          echo "GitHub MCP endpoint returned HTTP $status"
          case "$status" in
            2*) ;;
            *)
              echo "github MCP rejected the token (HTTP $status)." >&2
              echo "Set GITHUB_MCP_TOKEN to a PAT." >&2
              exit 1
              ;;
          esac
      - name: Review pull request
        run: |
          opencode run --standalone --format json \
            --agent review-orchestrator \
            --model "${{ vars.AGENT_REVIEWER_MODEL }}" \
            "Review this pull request by loading and following the
          review-pr skill.

          <pull_request>
          Number: ${{ github.event.pull_request.number }}
          URL: ${{ github.event.pull_request.html_url }}
          Owner: ${{ github.repository_owner }}
          Repository: ${{ github.event.repository.name }}
          Base Branch: ${{ github.event.pull_request.base.ref }}
          Head Branch: ${{ github.event.pull_request.head.ref }}
          </pull_request>" > events.ndjson
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_MCP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload review event log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-review-events
          path: events.ndjson
          if-no-files-found: ignore
