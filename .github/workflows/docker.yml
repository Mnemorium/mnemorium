---
name: Mnemorium Docker

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '.dockerignore'

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hadolint:
    name: Hadolint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: Dockerfile

  semgrep-dockerfile:
    name: Scan Dockerfile
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run Semgrep Dockerfile scan
        run: semgrep scan --config p/dockerfile --error --metrics=off ./Dockerfile
