---
name: Mnemorium CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gatekeeper:
    runs-on: ubuntu-slim
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            docs
            test
            build
            ci
            chore
          scopes: |
            config
            agent
            devenv
            github
            test-e2e
            test-system
            sqlite3
            application
            development
            readme
            api

  changes:
    needs: [gatekeeper]
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust_any_changed }}
      python: ${{ steps.filter.outputs.python_any_changed }}
      markdown: ${{ steps.filter.outputs.markdown_any_changed }}
      docs: ${{ steps.filter.outputs.docs_any_changed }}
      sql: ${{ steps.filter.outputs.sql_any_changed }}
      shell: ${{ steps.filter.outputs.shell_any_changed }}
      nix: ${{ steps.filter.outputs.nix_any_changed }}
      deps: ${{ steps.filter.outputs.deps_any_changed }}
      lint: ${{ steps.filter.outputs.lint_any_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # v47.0.6
      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        id: filter
        with:
          files_yaml: |
            rust:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'docs/development/api/openapi.json'
            python:
              - '**/*.py'
              - 'ruff.toml'
              - 'pytest.ini'
              - 'requirements.txt'
            markdown:
              - '**/*.md'
              - '.prettierrc'
              - '.prettierignore'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'requirements.txt'
            sql:
              - 'migrations/**/*.sql'
              - 'requirements.txt'
            shell:
              - '**/*.sh'
            nix:
              - '**/*.nix'
            deps:
              - 'Cargo.toml'
              - 'Cargo.lock'
            lint:
              - '**'

  docs-only:
    needs: [gatekeeper]
    if: >-
      startsWith(github.event.pull_request.title, 'docs:') ||
      startsWith(github.event.pull_request.title, 'docs!') ||
      startsWith(github.event.pull_request.title, 'docs(')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # v47.0.6
      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        id: changed
        with:
          files: |
            docs/**
            **/*.md
            mkdocs.yml
            **/*.png
            .github/assets/**
      - name: Reject non-documentation changes
        if: steps.changed.outputs.other_modified_files != ''
        env:
          OTHER: ${{ steps.changed.outputs.other_modified_files }}
        run: |
          echo "A docs PR may only change documentation." >&2
          for f in $OTHER; do
            echo "  unexpected: $f" >&2
          done
          exit 1

  betterleaks:
    needs: [gatekeeper]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # v0.1.0
      - id: betterleaks
        uses: dortort/betterleaks-action@cd0b905aa4befb8f42f8b1ab98150180c9e77515  # yamllint disable-line rule:line-length
        with:
          version: v1.8.1
          scan-mode: git
          config: .betterleaks.toml
          fail-on-leak: true
          validation: "false"
          redact: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: betterleaks-report
          path: ${{ steps.betterleaks.outputs.report-path }}

  semgrep:
    needs: [gatekeeper]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Semgrep
        run: pip install semgrep==1.172.0
      - name: Scan
        run: |
          mkdir -p .artifacts
          semgrep scan \
            --config p/rust \
            --config p/security-audit \
            --config p/cwe-top-25 \
            --baseline-commit "${{ github.event.pull_request.base.sha }}" \
            --metrics=off \
            --sarif \
            --output .artifacts/semgrep.sarif
      - name: Gate on ERROR findings
        run: |
          python - .artifacts/semgrep.sarif <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              runs = json.load(fh).get("runs", [])

          findings = []
          for run in runs:
              driver = run.get("tool", {}).get("driver", {})
              levels = {
                  rule["id"]: rule.get("defaultConfiguration", {})
                  .get("level")
                  for rule in driver.get("rules", [])
              }
              for result in run.get("results", []):
                  level = levels.get(result.get("ruleId"))
                  if result.get("level", level) == "error":
                      findings.append(result)

          if findings:
              print(f"{len(findings)} ERROR finding(s).", file=sys.stderr)
              sys.exit(1)
          print("No semgrep ERROR findings.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif
          path: .artifacts/semgrep.sarif
          if-no-files-found: ignore

  rust:
    needs: [changes, betterleaks]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: >-
          cargo clippy --all-targets --all-features
          -- -D warnings
      - name: Build
        run: cargo build --bin server
      - name: No tests in domain/model
        run: script/no_domain_model_tests.sh
      - name: Verify OpenAPI spec is current
        run: |
          cargo run --bin openapi_gen
          if ! git diff --exit-code -- docs/development/api/openapi.json; then
            echo "docs/development/api/openapi.json is stale." >&2
            echo "Run 'cargo run --bin openapi_gen' and commit the result." >&2
            exit 1
          fi
      - name: Coverage
        run: >-
          cargo llvm-cov --lib
          --fail-under-functions 80
          --fail-under-regions 80
          --fail-under-lines 80

  security:
    needs: [changes, betterleaks]
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20,cargo-bundle-licenses
      - name: Check dependencies
        run: cargo deny check
      - name: Check third-party notices are current
        run: |
          cargo fetch
          script/generate_third_party_notices.sh --check

  python:
    needs: [changes, betterleaks]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  docs:
    needs: [changes, betterleaks]
    if: >-
      needs.changes.outputs.markdown == 'true' ||
      needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Install documentation dependencies
        run: pip install -r requirements.txt
      - name: Prettier format check
        run: npx --yes prettier@3.8.3 --check "**/*.md"
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
      - name: Build documentation
        if: needs.changes.outputs.docs == 'true'
        run: mkdocs build --strict

  sql:
    needs: [changes, betterleaks]
    if: needs.changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install sqlfluff
        run: pip install -r requirements.txt
      - name: Lint SQL
        run: sqlfluff lint --dialect sqlite migrations

  shell:
    needs: [changes, betterleaks]
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: shellcheck,shfmt
      - name: ShellCheck
        run: shellcheck script/*.sh
      - name: shfmt
        run: shfmt -d script/*.sh

  nix:
    needs: [changes, betterleaks]
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - name: nixfmt
        run: nix run nixpkgs#nixfmt -- --check devenv.nix

  lint:
    needs: [changes, betterleaks]
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ls-lint/action@v2
      - uses: taiki-e/install-action@taplo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install yamllint
        run: pip install -r requirements.txt
      - name: Check TOML
        run: taplo fmt --check
      - name: Lint YAML
        run: yamllint -c .yamllint .

  review:
    needs: [semgrep]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: semgrep-sarif
          path: .artifacts
      - run: npm install --global @opencode/cli
      - name: Check the GitHub MCP server connection
        env:
          GITHUB_MCP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST https://api.githubcopilot.com/mcp/ \
            -H "Authorization: Bearer $GITHUB_MCP_TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}')
          echo "GitHub MCP endpoint returned HTTP $status"
          case "$status" in
            2*) ;;
            *)
              echo "github MCP rejected the token (HTTP $status)." >&2
              echo "Set GITHUB_MCP_TOKEN to a PAT." >&2
              exit 1
              ;;
          esac
      - name: Review pull request
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_MCP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWER_MODEL: ${{ vars.AGENT_REVIEWER_MODEL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_OWNER: ${{ github.repository_owner }}
          PR_REPOSITORY: ${{ github.event.repository.name }}
          PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          opencode run --standalone --format json \
            --agent plan \
            --model "$REVIEWER_MODEL" \
            "Review this pull request by loading and following the
          mn-review skill.

          <pull_request>
          Number: ${PR_NUMBER}
          URL: ${PR_URL}
          Owner: ${PR_OWNER}
          Repository: ${PR_REPOSITORY}
          Base Branch: ${PR_BASE_BRANCH}
          Head Branch: ${PR_HEAD_BRANCH}
          </pull_request>" > events.ndjson
      - name: Upload review event log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-review-events
          path: events.ndjson
          if-no-files-found: ignore
