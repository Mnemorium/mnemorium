---
name: Mnemorium CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    types:
      - checks_requested
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gatekeeper:
    runs-on: ubuntu-slim
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            docs
            test
            build
            ci
            chore
          scopes: |
            domain
            application
            infrastructure
            api
            persistence
            server
            test-e2e
            test-config
            user
            development
            repo
            config
            agent
            github
            devenv
            devops

  changes:
    needs: [gatekeeper]
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust_any_changed }}
      python: ${{ steps.filter.outputs.python_any_changed }}
      markdown: ${{ steps.filter.outputs.markdown_any_changed }}
      docs: ${{ steps.filter.outputs.docs_any_changed }}
      sql: ${{ steps.filter.outputs.sql_any_changed }}
      shell: ${{ steps.filter.outputs.shell_any_changed }}
      nix: ${{ steps.filter.outputs.nix_any_changed }}
      deps: ${{ steps.filter.outputs.deps_any_changed }}
      lint: ${{ steps.filter.outputs.lint_any_changed }}
      container: ${{ steps.filter.outputs.container_any_changed }}
      ci: ${{ steps.filter.outputs.ci_any_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        id: filter
        with:
          files_yaml: |
            rust:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'docs/openapi.json'
            python:
              - '**/*.py'
              - 'ruff.toml'
              - 'pytest.ini'
              - 'requirements.txt'
            markdown:
              - '**/*.md'
              - '.prettierrc'
              - '.prettierignore'
              - '.markdownlint-cli2.jsonc'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'requirements.txt'
            sql:
              - 'migrations/**/*.sql'
              - 'requirements.txt'
            shell:
              - '**/*.sh'
            nix:
              - '**/*.nix'
              - 'devenv.lock'
              - 'devenv.yaml'
              - '.github/workflows/ci.yml'
            deps:
              - 'Cargo.toml'
              - 'Cargo.lock'
            lint:
              - '**'
            container:
              - 'Dockerfile'
              - '.dockerignore'
            ci:
              - '.github/workflows/**'

  scopes:
    needs: [changes, betterleaks]
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Install yq
        run: pip install yq==3.4.3
      - name: Check commit scope taxonomy
        run: script/check_scopes.sh

  rules:
    needs: [changes, betterleaks]
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24.19.0"
      - name: Install rule-checking tools
        run: |
          pip install -r requirements.txt
          pip install yq==3.4.3
          npm install -g @ast-grep/cli@0.45.1
      - name: Run rulebook checks
        run: script/rule_enforcer.sh check

  docs-only:
    needs: [gatekeeper]
    if: >-
      github.event_name == 'pull_request' &&
      (startsWith(github.event.pull_request.title, 'docs:') ||
      startsWith(github.event.pull_request.title, 'docs!') ||
      startsWith(github.event.pull_request.title, 'docs('))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        id: changed
        with:
          files: |
            docs/**
            **/*.md
            mkdocs.yml
            **/*.png
            .github/assets/**
      - name: Reject non-documentation changes
        if: steps.changed.outputs.other_modified_files != ''
        env:
          OTHER: ${{ steps.changed.outputs.other_modified_files }}
        run: |
          echo "A docs PR may only change documentation." >&2
          for f in $OTHER; do
            echo "  unexpected: $f" >&2
          done
          exit 1

  betterleaks:
    needs: [gatekeeper]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: betterleaks
        uses: dortort/betterleaks-action@cd0b905aa4befb8f42f8b1ab98150180c9e77515  # v0.1.0
        with:
          version: v1.8.1
          scan-mode: git
          config: .betterleaks.toml
          fail-on-leak: true
          validation: "false"
          redact: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: betterleaks-report
          path: ${{ steps.betterleaks.outputs.report-path }}

  semgrep:
    needs: [gatekeeper]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Semgrep
        run: pip install semgrep==1.172.0
      - name: Scan
        run: |
          mkdir -p .artifacts
          semgrep scan \
            --config p/rust \
            --config p/security-audit \
            --config p/cwe-top-25 \
            --baseline-commit "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}" \
            --metrics=off \
            --sarif \
            --output .artifacts/semgrep.sarif
      - name: Gate on ERROR findings
        run: |
          python - .artifacts/semgrep.sarif <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              runs = json.load(fh).get("runs", [])

          findings = []
          for run in runs:
              driver = run.get("tool", {}).get("driver", {})
              levels = {
                  rule["id"]: rule.get("defaultConfiguration", {})
                  .get("level")
                  for rule in driver.get("rules", [])
              }
              for result in run.get("results", []):
                  level = levels.get(result.get("ruleId"))
                  if result.get("level", level) == "error":
                      findings.append(result)

          if findings:
              print(f"{len(findings)} ERROR finding(s).", file=sys.stderr)
              sys.exit(1)
          print("No semgrep ERROR findings.")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: semgrep-sarif
          path: .artifacts/semgrep.sarif
          if-no-files-found: ignore

  rust:
    needs: [changes, betterleaks]
    if: >-
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177  # v2
        with:
          tool: cargo-llvm-cov
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: >-
          cargo clippy --all-targets --all-features
          -- -D warnings
      - name: Build
        run: cargo build --bin server
      - name: Verify OpenAPI spec is current
        run: |
          cargo run --bin openapi_gen
          if [ "$(tail -c1 docs/openapi.json | od -An -t x1 | tr -d ' \n')" != "0a" ]; then
            echo "docs/openapi.json must end with exactly one trailing newline." >&2
            exit 1
          fi
          if ! git diff --exit-code -- docs/openapi.json; then
            echo "docs/openapi.json is stale." >&2
            echo "Run 'cargo run --bin openapi_gen' and commit the result." >&2
            exit 1
          fi
      - name: Coverage
        run: |
          mkdir -p .artifacts/coverage
          cargo llvm-cov --lib \
            --fail-under-functions 80 \
            --fail-under-regions 80 \
            --fail-under-lines 80 \
            --lcov --output-path .artifacts/coverage/lcov.info
      - name: Coverage summary
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .artifacts/coverage
          cargo llvm-cov report > .artifacts/coverage/summary.txt
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: coverage-report
          path: .artifacts/coverage
          retention-days: 14
          if-no-files-found: ignore

  system:
    needs: [changes, betterleaks, rust]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.betterleaks.result == 'success' &&
      (needs.rust.result == 'success' || needs.rust.result == 'skipped') &&
      (needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.container == 'true' ||
      needs.changes.outputs.sql == 'true' ||
      needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Restore Buildx layers
        id: buildx-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/.buildx-cache-e2e
          key: ${{ runner.os }}-buildx-e2e-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-e2e-
            ${{ runner.os }}-buildx-release-
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          load: true
          tags: mnemorium
          cache-from: type=local,src=/tmp/.buildx-cache-e2e
          cache-to: type=local,dest=/tmp/.buildx-cache-e2e-new,mode=max
      - name: Run E2E tests
        env:
          NO_BUILD: "1"
        run: script/e2e.sh
      - name: Run configuration tests
        if: always() && steps.build.outcome == 'success'
        env:
          NO_BUILD: "1"
        run: script/configuration.sh
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: e2e-report
          path: .artifacts/e2e
          retention-days: 14
          if-no-files-found: ignore
      - name: Stop container
        if: always()
        run: docker rm -f mnemorium-e2e || true
      - name: Rotate Buildx cache
        if: always()
        run: |
          if [ -d /tmp/.buildx-cache-e2e-new ]; then
            rm -rf /tmp/.buildx-cache-e2e
            mv /tmp/.buildx-cache-e2e-new /tmp/.buildx-cache-e2e
          fi
      - name: Save Buildx layers
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/.buildx-cache-e2e
          key: ${{ runner.os }}-buildx-e2e-${{ github.sha }}

  security:
    needs: [changes, betterleaks]
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: "1.98.0"
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177  # v2
        with:
          # cargo-about is pinned to the version devenv/nixpkgs ships: the
          # notices are byte-compared, so both environments must run the same
          # generator. Bump this in lockstep with `pkgs.cargo-about` in
          # devenv.nix.
          tool: cargo-deny@0.20,cargo-about@0.9.0
      - name: Check dependencies
        run: cargo deny check
      - name: Check third-party notices are current
        run: |
          cargo fetch
          script/generate_third_party_notices.sh --check

  python:
    needs: [changes, betterleaks]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  docs:
    needs: [changes, betterleaks]
    if: >-
      needs.changes.outputs.markdown == 'true' ||
      needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24.19.0"
      - name: Install documentation dependencies
        run: pip install -r requirements.txt
      - name: Prettier format check
        run: npx --yes prettier@3.8.3 --check "**/*.md"
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24
        with:
          globs: "**/*.md"
      - name: Build documentation
        if: needs.changes.outputs.docs == 'true'
        run: mkdocs build --strict

  sql:
    needs: [changes, betterleaks]
    if: needs.changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Install sqlfluff
        run: pip install -r requirements.txt
      - name: Lint SQL
        run: sqlfluff lint --dialect sqlite migrations

  shell:
    needs: [changes, betterleaks]
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177  # v2
        with:
          tool: shellcheck,shfmt
      - name: ShellCheck
        run: shellcheck script/*.sh
      - name: shfmt
        run: shfmt -d script/*.sh

  nix:
    needs: [changes, betterleaks]
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702  # v31
      - name: nixfmt
        # Resolve nixfmt from the revision devenv.lock pins, so the formatter
        # matches the development environment and cannot drift. The repository
        # stays workflow-literal and the revision is validated as a full commit,
        # so a PR-controlled lockfile cannot redirect the fetched source.
        run: |
          node="$(jq -r '.nodes.root.inputs.nixpkgs' devenv.lock)"
          if [[ -z "${node}" || "${node}" == "null" ]]; then
            echo "devenv.lock root has no nixpkgs input" >&2
            exit 1
          fi
          rev="$(jq -r --arg n "${node}" '.nodes[$n].locked.rev' devenv.lock)"
          if [[ ! "${rev}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "devenv.lock nixpkgs input is not pinned to a commit: ${rev}" >&2
            exit 1
          fi
          nix run "github:cachix/devenv-nixpkgs/${rev}#nixfmt" -- --check devenv.nix

  lint:
    needs: [changes, betterleaks]
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ls-lint/action@a87c5eb4fb26d7af1bd0adba203dd1e76f7e94eb  # v2
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177  # v2
        with:
          tool: taplo
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Install yamllint
        run: pip install -r requirements.txt
      - name: Check TOML
        run: taplo fmt --check
      - name: Lint YAML
        run: yamllint -c .yamllint .
