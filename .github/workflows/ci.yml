---
name: Mnemorium CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    types:
      - checks_requested
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scopes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Install yq
        run: pip install yq==3.4.3
      - name: Check commit scope taxonomy
        run: script/check_scopes.sh

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Semgrep
        run: pip install semgrep==1.172.0
      - name: Scan
        run: |
          mkdir -p .artifacts
          semgrep scan \
            --config p/rust \
            --config p/security-audit \
            --config p/cwe-top-25 \
            --config p/github-actions \
            --config security/semgrep \
            --baseline-commit "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}" \
            --metrics=off \
            --sarif \
            --output .artifacts/semgrep.sarif
      - name: Gate on ERROR findings
        run: |
          python - .artifacts/semgrep.sarif <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              runs = json.load(fh).get("runs", [])

          findings = []
          for run in runs:
              driver = run.get("tool", {}).get("driver", {})
              levels = {
                  rule["id"]: rule.get("defaultConfiguration", {})
                  .get("level")
                  for rule in driver.get("rules", [])
              }
              for result in run.get("results", []):
                  level = levels.get(result.get("ruleId"))
                  if result.get("level", level) == "error":
                      findings.append(result)

          if findings:
              print(f"{len(findings)} ERROR finding(s).", file=sys.stderr)
              sys.exit(1)
          print("No semgrep ERROR findings.")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: semgrep-sarif
          path: .artifacts/semgrep.sarif
          if-no-files-found: ignore
