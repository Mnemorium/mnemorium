---
name: Mnemorium CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    types:
      - checks_requested
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gatekeeper:
    runs-on: ubuntu-slim
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            docs
            test
            build
            ci
            chore
          scopes: |
            domain
            application
            infrastructure
            api
            persistence
            server
            test-e2e
            user
            development
            repo
            config
            agent
            github
            devenv
            devops

  changes:
    needs: [gatekeeper]
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust_any_changed }}
      python: ${{ steps.filter.outputs.python_any_changed }}
      markdown: ${{ steps.filter.outputs.markdown_any_changed }}
      docs: ${{ steps.filter.outputs.docs_any_changed }}
      sql: ${{ steps.filter.outputs.sql_any_changed }}
      shell: ${{ steps.filter.outputs.shell_any_changed }}
      nix: ${{ steps.filter.outputs.nix_any_changed }}
      deps: ${{ steps.filter.outputs.deps_any_changed }}
      lint: ${{ steps.filter.outputs.lint_any_changed }}
      container: ${{ steps.filter.outputs.container_any_changed }}
      ci: ${{ steps.filter.outputs.ci_any_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        id: filter
        with:
          files_yaml: |
            rust:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'docs/openapi.json'
            python:
              - '**/*.py'
              - 'ruff.toml'
              - 'pytest.ini'
              - 'requirements.txt'
            markdown:
              - '**/*.md'
              - '.prettierrc'
              - '.prettierignore'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'requirements.txt'
            sql:
              - 'migrations/**/*.sql'
              - 'requirements.txt'
            shell:
              - '**/*.sh'
            nix:
              - '**/*.nix'
            deps:
              - 'Cargo.toml'
              - 'Cargo.lock'
            lint:
              - '**'
            container:
              - 'Dockerfile'
              - '.dockerignore'
            ci:
              - '.github/workflows/**'

  scopes:
    needs: [changes, betterleaks]
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check commit scope taxonomy
        run: script/check_scopes.sh

  docs-only:
    needs: [gatekeeper]
    if: >-
      github.event_name == 'pull_request' &&
      (startsWith(github.event.pull_request.title, 'docs:') ||
      startsWith(github.event.pull_request.title, 'docs!') ||
      startsWith(github.event.pull_request.title, 'docs('))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        id: changed
        with:
          files: |
            docs/**
            **/*.md
            mkdocs.yml
            **/*.png
            .github/assets/**
      - name: Reject non-documentation changes
        if: steps.changed.outputs.other_modified_files != ''
        env:
          OTHER: ${{ steps.changed.outputs.other_modified_files }}
        run: |
          echo "A docs PR may only change documentation." >&2
          for f in $OTHER; do
            echo "  unexpected: $f" >&2
          done
          exit 1

  betterleaks:
    needs: [gatekeeper]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: betterleaks
        uses: dortort/betterleaks-action@cd0b905aa4befb8f42f8b1ab98150180c9e77515  # v0.1.0
        with:
          version: v1.8.1
          scan-mode: git
          config: .betterleaks.toml
          fail-on-leak: true
          validation: "false"
          redact: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: betterleaks-report
          path: ${{ steps.betterleaks.outputs.report-path }}

  semgrep:
    needs: [gatekeeper]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install Semgrep
        run: pip install semgrep==1.172.0
      - name: Scan
        run: |
          mkdir -p .artifacts
          semgrep scan \
            --config p/rust \
            --config p/security-audit \
            --config p/cwe-top-25 \
            --baseline-commit "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}" \
            --metrics=off \
            --sarif \
            --output .artifacts/semgrep.sarif
      - name: Gate on ERROR findings
        run: |
          python - .artifacts/semgrep.sarif <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              runs = json.load(fh).get("runs", [])

          findings = []
          for run in runs:
              driver = run.get("tool", {}).get("driver", {})
              levels = {
                  rule["id"]: rule.get("defaultConfiguration", {})
                  .get("level")
                  for rule in driver.get("rules", [])
              }
              for result in run.get("results", []):
                  level = levels.get(result.get("ruleId"))
                  if result.get("level", level) == "error":
                      findings.append(result)

          if findings:
              print(f"{len(findings)} ERROR finding(s).", file=sys.stderr)
              sys.exit(1)
          print("No semgrep ERROR findings.")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: semgrep-sarif
          path: .artifacts/semgrep.sarif
          if-no-files-found: ignore

  rust:
    needs: [changes, betterleaks]
    if: >-
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # v1
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0  # v2
        with:
          tool: cargo-llvm-cov
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: >-
          cargo clippy --all-targets --all-features
          -- -D warnings
      - name: Build
        run: cargo build --bin server
      - name: No tests in domain/model
        run: script/no_domain_model_tests.sh
      - name: No outward imports
        run: script/no_outward_imports.sh
      - name: Verify OpenAPI spec is current
        run: |
          cargo run --bin openapi_gen
          if [ "$(tail -c1 docs/openapi.json | od -An -t x1 | tr -d ' \n')" != "0a" ]; then
            echo "docs/openapi.json must end with exactly one trailing newline." >&2
            exit 1
          fi
          if ! git diff --exit-code -- docs/openapi.json; then
            echo "docs/openapi.json is stale." >&2
            echo "Run 'cargo run --bin openapi_gen' and commit the result." >&2
            exit 1
          fi
      - name: Coverage
        run: |
          mkdir -p .artifacts/coverage
          cargo llvm-cov --lib \
            --fail-under-functions 80 \
            --fail-under-regions 80 \
            --fail-under-lines 80 \
            --lcov --output-path .artifacts/coverage/lcov.info
      - name: Coverage summary
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .artifacts/coverage
          cargo llvm-cov report > .artifacts/coverage/summary.txt
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-report
          path: .artifacts/coverage
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    needs: [changes, betterleaks, rust]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.betterleaks.result == 'success' &&
      (needs.rust.result == 'success' || needs.rust.result == 'skipped') &&
      (needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.container == 'true' ||
      needs.changes.outputs.sql == 'true' ||
      needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          load: true
          tags: mnemorium
          cache-from: type=gha,scope=e2e-image
          cache-to: type=gha,mode=max,scope=e2e-image
      - name: Start container
        run: |
          docker rm -f mnemorium-e2e || true
          docker run -d --name mnemorium-e2e -p 4080:4080 \
            -e MNEMORIUM__SECURITY__RATE_LIMIT__BURST_SIZE=1000 \
            mnemorium
      - name: Wait for health
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "server not healthy within 60s" >&2
          exit 1
      - name: Run E2E tests
        env:
          PYTHONPATH: ${{ github.workspace }}/test/e2e
          MNEMORIUM_E2E_BASE_URL: http://127.0.0.1:4080
        run: >-
          pytest -p no:cacheprovider -ra --tb=short
          --junitxml=.artifacts/e2e/junit.xml test/e2e
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: e2e-report
          path: .artifacts/e2e
          retention-days: 14
          if-no-files-found: ignore
      - name: Stop container
        if: always()
        run: docker rm -f mnemorium-e2e || true

  security:
    needs: [changes, betterleaks]
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # v1
        with:
          toolchain: "1.98.0"
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0  # v2
        with:
          # cargo-about is pinned to the version devenv/nixpkgs ships: the
          # notices are byte-compared, so both environments must run the same
          # generator. Bump this in lockstep with `pkgs.cargo-about` in
          # devenv.nix.
          tool: cargo-deny@0.20,cargo-about@0.9.0
      - name: Check dependencies
        run: cargo deny check
      - name: Check third-party notices are current
        run: |
          cargo fetch
          script/generate_third_party_notices.sh --check

  python:
    needs: [changes, betterleaks]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  docs:
    needs: [changes, betterleaks]
    if: >-
      needs.changes.outputs.markdown == 'true' ||
      needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Install documentation dependencies
        run: pip install -r requirements.txt
      - name: Prettier format check
        run: npx --yes prettier@3.8.3 --check "**/*.md"
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24
        with:
          globs: "**/*.md"
      - name: Build documentation
        if: needs.changes.outputs.docs == 'true'
        run: mkdocs build --strict

  sql:
    needs: [changes, betterleaks]
    if: needs.changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install sqlfluff
        run: pip install -r requirements.txt
      - name: Lint SQL
        run: sqlfluff lint --dialect sqlite migrations

  shell:
    needs: [changes, betterleaks]
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0  # v2
        with:
          tool: shellcheck,shfmt
      - name: ShellCheck
        run: shellcheck script/*.sh
      - name: shfmt
        run: shfmt -d script/*.sh

  nix:
    needs: [changes, betterleaks]
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31
      - name: nixfmt
        # Pin nixfmt to the nixpkgs revision locked in devenv.lock, not the floating `nixpkgs` registry.
        run: nix run github:cachix/devenv-nixpkgs/c2f38fe7f9e04d9aadd354d380f2bd40531d9737#nixfmt -- --check devenv.nix

  lint:
    needs: [changes, betterleaks]
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ls-lint/action@02e380fe8733d499cbfc9e22276de5085508a5bd  # v2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0  # v2
        with:
          tool: taplo
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install yamllint
        run: pip install -r requirements.txt
      - name: Check TOML
        run: taplo fmt --check
      - name: Lint YAML
        run: yamllint -c .yamllint .

  review:
    needs: [semgrep, rust, e2e]
    if: >-
      always() &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The review agent runs with repository secrets and write-scoped
          # tokens. Load the agent, skills and project config from the trusted
          # base revision so a pull request supplies content to review but never
          # the configuration that executes with those credentials.
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          name: semgrep-sarif
          path: .artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          name: coverage-report
          path: .artifacts/coverage
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          name: e2e-report
          path: .artifacts/e2e
      - run: npm install --global @opencode/cli@2.0.22
      - name: Check the GitHub MCP server connection
        env:
          GITHUB_MCP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST https://api.githubcopilot.com/mcp/ \
            -H "Authorization: Bearer $GITHUB_MCP_TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}')
          echo "GitHub MCP endpoint returned HTTP $status"
          case "$status" in
            2*) ;;
            *)
              echo "github MCP rejected the token (HTTP $status)." >&2
              echo "Set GITHUB_MCP_TOKEN to a PAT." >&2
              exit 1
              ;;
          esac
      - name: Review pull request
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_MCP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWER_MODEL: ${{ vars.AGENT_REVIEWER_MODEL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_OWNER: ${{ github.repository_owner }}
          PR_REPOSITORY: ${{ github.event.repository.name }}
          PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          opencode run --standalone --format json \
            --agent mn-reviewer \
            --model "$REVIEWER_MODEL" \
            "Review this pull request by loading and following the
          mn-review skill.

          <pull_request>
          Number: ${PR_NUMBER}
          URL: ${PR_URL}
          Owner: ${PR_OWNER}
          Repository: ${PR_REPOSITORY}
          Base Branch: ${PR_BASE_BRANCH}
          Head Branch: ${PR_HEAD_BRANCH}
          </pull_request>" > events.ndjson
      - name: Upload review event log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: opencode-review-events
          path: events.ndjson
          if-no-files-found: ignore
