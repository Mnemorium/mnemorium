---
name: Mnemorium CD

on:
  push:
    branches:
      - main

# Run releases one at a time: queued runs wait instead of cancelling the
# in-flight one, so two merged PRs can never race to bump the version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release new Mnemorium version
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Configure git identity
        run: |
          bot="41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git config user.email "$bot"

      - name: Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >
          npx --yes
          --package semantic-release@25.0.9
          --package @semantic-release/changelog@7.0.0
          --package @semantic-release/exec@7.1.0
          --package @semantic-release/git@11.0.1
          --package semantic-release-openapi@2.3.6
          --package @semantic-release-plus/docker@3.1.3
          --package conventional-changelog-conventionalcommits@10.4.0
          semantic-release
