---
name: Mnemorium CD

on:
  push:
    branches:
      - main
  # Manual trigger: re-run a failed release (see the release recovery runbook)
  # and rehearse the pipeline. Runs the same release job as a main push.
  workflow_dispatch:

# Run releases one at a time: queued runs wait instead of cancelling the
# in-flight one, so two merged PRs can never race to bump the version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release new Mnemorium version
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: "1.98.0"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "24"

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - name: Cache Buildx layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/.buildx-cache-release
          key: ${{ runner.os }}-buildx-release-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-release-

      - name: Configure git identity
        run: |
          bot="41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git config user.email "$bot"

      # The release regenerates THIRD_PARTY_NOTICES.txt so the file the image
      # ships (Dockerfile) tracks the released version and lockfile. Pinned to
      # the version devenv/nixpkgs ships, like the CI `security` job: the
      # notices are byte-compared, so every environment runs the same
      # generator. Bump in lockstep with `pkgs.cargo-about` in devenv.nix.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32  # v2
        with:
          tool: cargo-about@0.9.0

      # conventional-changelog-conventionalcommits is pinned to the exact 9.3.1
      # on purpose: v10 replaced Handlebars templates with render functions and
      # now requires conventional-changelog-writer@9, but the writer bundled by
      # @semantic-release/release-notes-generator is capped at ^8. Bump to v10
      # only once that plugin adopts conventional-changelog-writer@^9.
      - name: Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >
          npx --yes
          --package semantic-release@25.0.9
          --package @semantic-release/changelog@7.0.0
          --package @semantic-release/exec@7.1.0
          --package @semantic-release/git@11.0.1
          --package @semantic-release-plus/docker@3.1.3
          --package conventional-changelog-conventionalcommits@9.3.1
          semantic-release

      - name: Rotate Buildx cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache-release
          if [ -d /tmp/.buildx-cache-release-new ]; then
            mv /tmp/.buildx-cache-release-new /tmp/.buildx-cache-release
          fi
