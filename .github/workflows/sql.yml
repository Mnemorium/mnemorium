---
name: Mnemorium SQL

on:
  pull_request:
    branches:
      - main
    paths:
      - 'migrations/**/*.sql'
      - 'test/api/seed/**/*.sql'
      - 'test/performance/seed/**/*.sql'
      - 'test/system/seed/**/*.sql'
      - '.sqlfluff'
      - 'requirements.txt'

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sqlfluff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Install sqlfluff
        run: pip install -r requirements.txt
      - name: Lint SQL
        run: sqlfluff lint --dialect sqlite migrations test/api/seed/sql test/performance/seed/sql test/system/seed/sql
