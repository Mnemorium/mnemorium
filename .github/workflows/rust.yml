---
name: Mnemorium Rust

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'test/api/seed/**'
      - 'test/performance/seed/**'
      - 'test/system/seed/**'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, Clippy and unused dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          shared-key: quality
          cache-on-failure: true
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b  # v2
        with:
          # cargo-machete is pinned to the version devenv/nixpkgs ships
          # (`pkgs.cargo-machete`), so the local hook and this job agree.
          tool: cargo-machete@0.9.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: >-
          cargo clippy --all-targets --all-features
          -- -D warnings
      - name: Clippy (default features)
        run: >-
          cargo clippy --all-targets
          -- -D warnings
      - name: Check for unused dependencies
        run: cargo machete
      - name: Build
        run: cargo build --bin server

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          shared-key: test
          cache-on-failure: true
      - name: Run tests
        run: cargo test --all-features --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: "1.98.0"
          components: llvm-tools-preview
      # Coverage instruments the build, so it gets its own cache key rather
      # than thrashing the quality and test caches with different RUSTFLAGS.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          shared-key: coverage
          cache-on-failure: true
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b  # v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage
        run: |
          mkdir -p .artifacts/coverage
          cargo llvm-cov --lib \
            --features test-seed \
            --locked \
            --ignore-filename-regex 'src/lib/infrastructure/inbound/rest/handler|src/lib/infrastructure/seed.rs' \
            --fail-under-functions 80 \
            --fail-under-regions 80 \
            --fail-under-lines 80 \
            --lcov --output-path .artifacts/coverage/lcov.info
      - name: Coverage summary
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .artifacts/coverage
          cargo llvm-cov report > .artifacts/coverage/summary.txt
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: coverage-report
          path: .artifacts/coverage
          retention-days: 14
          if-no-files-found: error

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: "1.98.0"
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b  # v2
        with:
          # cargo-about is pinned to the version devenv/nixpkgs ships: the
          # notices are byte-compared, so both environments must run the same
          # generator. Bump this in lockstep with `pkgs.cargo-about` in
          # devenv.nix.
          tool: cargo-deny@0.20,cargo-about@0.9.0
      - name: Check dependencies
        run: cargo deny check
      - name: Check third-party notices are current
        run: |
          cargo fetch
          script/generate_third_party_notices.sh --check

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Semgrep
        run: pip install semgrep==1.172.0
      - name: Scan
        run: |
          # `--severity ERROR` keeps this gate to errors only: the repository
          # rules mark a finding ERROR to fail CI and WARNING to report only,
          # and `--error` alone would fail on the warnings.
          semgrep scan \
            --config p/rust \
            --config p/security-audit \
            --config p/cwe-top-25 \
            --config security/semgrep \
            --severity ERROR \
            --metrics=off \
            --error \
            .
