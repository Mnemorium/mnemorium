[pytest]
# E2E test files are named after use cases (e.g. create_user_account.py),
# not with a test_* prefix, so collect those snake_case modules as well.
python_files = test_*.py *_test.py *_*.py

# Both black-box suites drive the containerised image. A bare `pytest` collects
# exactly these folders; each runner names its own folder explicitly.
testpaths = test/e2e test/configuration

markers =
    state_scenario(name): the openspec instance/state scenario a test asserts
    slow: a test that starts more than one server or waits on a race
