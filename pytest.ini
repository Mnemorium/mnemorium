[pytest]
# The patterns collect `test_*.py`, `*_test.py` and `*_*.py` modules. The system
# suite names one module per feature area — `authentication.py` and `upload.py`
# among them — so `test/system/conftest.py` collects those single-word modules
# itself rather than relying on the patterns.
python_files = test_*.py *_test.py *_*.py

# The black-box suites drive the containerised image. A bare `pytest` collects
# exactly this folder; `script/system.sh` names it explicitly.
testpaths = test/system

# The shared harness is a plugin, not a conftest.py, so it stays a distinct
# module in sys.modules beside `test/system/conftest.py`.
pythonpath = test/util
addopts = -p harness

markers =
    slow: a test that starts more than one server or waits on a race
