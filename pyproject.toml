# Python tool configuration. The file sits at the repository root because all four
# tools below resolve the test tree from here: pytest adds `test/util` and the
# generated `test/generated` to `sys.path`, ruff anchors its `extend-exclude` globs
# here, pyright derives its search roots from `extraPaths`, and vulture resolves its
# `paths` and exemptions here.

[tool.pytest.ini_options]
# The patterns collect `test_*.py`, `*_test.py` and `*_*.py` modules. The system
# suite names one module per feature area — `authentication.py` and `upload.py`
# among them — so `test/system/conftest.py` collects those single-word modules
# itself rather than relying on the patterns.
python_files = ["test_*.py", "*_test.py", "*_*.py"]

# A bare `pytest` runs both suites: the black-box system suite that drives the
# containerised image, and the container-free API cases beside it.
# `script/system.sh` names `test/system` explicitly.
testpaths = ["test/system", "test/api"]

# The shared harness is a plugin, not a conftest.py, so it stays a distinct
# module in sys.modules beside `test/system/conftest.py`. `test/generated` holds
# the system suite's typed client, which `script/openapi_client.sh` regenerates
# from the image under test (it is never committed).
pythonpath = ["test/util", "test/generated"]
addopts = ["-p", "harness", "--strict-markers"]

markers = [
  "slow: a test that starts more than one server or waits on a race",
  "own_instance(reason): the test starts its own container; reason is one of first_boot, restart, global_filesystem, log_sink, exact_collection, process_state",
  "positive: the case proves a positive scenario",
  "negative: the case proves a negative scenario",
  "boundary: the case proves a boundary scenario",
  "security: the case proves a security scenario",
  "error_handling: the case proves an error-handling scenario",
  "recovery: the case proves a recovery scenario",
  "alternate_flow: the case proves an alternate-flow scenario",
  "business_rule: the case proves a business-rule scenario",
]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["docs", "site", "target", ".devenv", "test/generated"]

[tool.ruff.lint]
extend-select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # import sorting
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplification
]

[tool.vulture]
# The test tree is the repository's whole Python surface: the server is Rust, so
# this is the only place dead Python can hide. Paths are relative to this file,
# which is why the tool runs from the repository root.
paths = ["test"]
# The system suite's typed client is generated by `script/openapi_client.sh` and
# never committed, so its own dead-code-looking surface is not this tree's.
exclude = ["test/generated"]
# 60% is the default and the useful floor: unused functions, constants and
# attributes, which neither ruff nor pyright checks. Ruff owns the 90% unused-import
# class and F841 already owns unused locals; unused arguments and unreachable code
# sit at 100%.
min_confidence = 60
# `filter_case` is an entry point: `schemathesis.toml` loads this module by path and
# calls the hook by name, so no Python code references it. The two custom checks
# are registered the same way through `@schemathesis.check`.
ignore_decorators = ["@schemathesis.hook", "@schemathesis.check"]
# Names whose owner resolves them outside this tree: pytest's hooks and the
# `pytestmark` markers, the `ctx` and `call` parameters whose names the caller fixes
# (Schemathesis and the pytest hookspec respectively), and the sqlite3 Connection
# attributes the suite sets. A whitelist module would restate these as bare
# expressions, which ruff rejects (B018 useless expression, F821 undefined name).
# The scenario-type members are referenced as `TestType.<member>` at the call site
# that types a case; the ones no case types yet are not dead code.
ignore_names = [
  "pytest*",
  "row_factory",
  "shouldstop",
  "ctx",
  "call",
  "POSITIVE",
  "NEGATIVE",
  "BOUNDARY",
  "SECURITY",
  "ERROR_HANDLING",
  "RECOVERY",
  "ALTERNATE_FLOW",
  "BUSINESS_RULE",
]

[tool.pyright]
# The suite is not type-checked: `off` keeps the editor to import resolution,
# the only Python diagnostic this repository acts on (ruff owns the rest), and
# matches Pylance's default. Raising it is a deliberate change, not a fix.
include = ["test"]
extraPaths = ["test/util", "test/system", "test/api", "test/generated"]
typeCheckingMode = "off"
