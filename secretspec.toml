#:schema https://secretspec.dev/schema/secretspec.schema.json

# Local development credentials. The declarations are committed; the values are
# not. Store a value with `secretspec set GITHUB_MCP_TOKEN` and it lands in the
# provider below.
#
# The `dotenv` provider stores the value in plaintext in `.env`, which is fine
# for local development only. To use a real secret store, point
# `[providers].local` at it (for example `keyring://`, `onepassword://...`,
# `vault://...`) and drop `provider: dotenv` from `devenv.yaml`.

[project]
name = "mnemorium"
revision = "1.0"

[providers]
local = "dotenv:.env"

[profiles.default]
GITHUB_MCP_TOKEN = { description = "GitHub token for the GitHub MCP server (fine-grained PAT: Metadata read, Pull requests read/write, Issues read/write, Contents read)", required = false, providers = [
  "local",
] }
