---
ls:
  script:
    .*: exists:0  # any non-shell scripts aren't allowed
    .sh: snake_case
  migrations:
    .*: exists:0  # any non-sql scripts aren't allowed
    .sql: snake_case

  .rs: snake_case
  .py: snake_case
  .md: PascalCase
ignore:
  - .devenv
  - .artifacts
  - README.md
  - AGENTS.md
  - CHANGELOG.md
  - docs/index.md
  - .github/pull_request_template.md
  - target
  - .agents
  - .opencode
  - .pytest_cache
  - test/TODO.md
