---
id: sty-rust-009
language: Rust
severity: error
message: >-
  a request body struct is named <Context>Request and derives at least
  Deserialize and ToSchema
files:
  - src/lib/infrastructure/inbound/rest/handler/**/*.rs
rule:
  any:
    # A struct named *Request must derive Deserialize and ToSchema. The derive
    # attribute precedes the struct (a following sibling is unreachable by
    # `has`), so each required trait is matched with `follows`; `stopBy: end`
    # skips intervening attributes such as #[non_exhaustive] and doc comments.
    - all:
        - kind: struct_item
        - regex: 'struct \w*Request\b'
        - not:
            all:
              - follows:
                  kind: attribute_item
                  regex: 'derive\([^)]*Deserialize'
                  stopBy: end
              - follows:
                  kind: attribute_item
                  regex: 'derive\([^)]*ToSchema'
                  stopBy: end
    # A request body extracted as Json<T> in a parameter must be named *Request;
    # a Json<T> return type is a response (STY-RUST-010), so the match is scoped
    # to parameters.
    - all:
        - kind: generic_type
        - regex: '^Json<'
        - inside:
            kind: parameter
            stopBy: end
        - not:
            all:
              - kind: generic_type
              - regex: '^Json<\w*Request>$'
