---
id: sty-rust-015
language: Rust
severity: hint
message: extract outbound-port error enums
files:
  - src/lib/domain/port/**/*.rs
rule:
  all:
    - kind: enum_item
    - any:
        - pattern: pub enum $ERROR_ENUM
        - pattern: pub(crate) enum $ERROR_ENUM
        - pattern: enum $ERROR_ENUM
    - regex: '^(pub(\(crate\))? )?enum \w+Error\b'
