---
id: sty-rust-051
language: Rust
severity: error
message: a *Filter struct is declared after the repository trait
rule:
  all:
    - kind: struct_item
    - any:
        - pattern: pub struct $FILTER
        - pattern: pub(crate) struct $FILTER
        - pattern: struct $FILTER
    - regex: '^(pub(\(crate\))? )?struct \w+Filter\b'
    - follows:
        kind: trait_item
        any:
          - pattern: 'pub trait $TRAIT'
          - pattern: 'pub(crate) trait $TRAIT'
          - pattern: 'trait $TRAIT'
        stopBy: end
