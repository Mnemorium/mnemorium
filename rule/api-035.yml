---
id: api-035
language: Rust
severity: hint
message: >-
  extract an `_embedded` HAL payload use, for API-035
rule:
  all:
    - any:
        - kind: string_literal
          regex: '^"_embedded"$'
        - kind: field_identifier
          regex: '^_embedded$'
    - any:
        - inside:
            kind: struct_item
            stopBy: end
            has:
              field: name
              pattern: $STRUCT
        - inside:
            kind: function_item
            stopBy: end
            has:
              field: name
              pattern: $FUNC
    - not:
        any:
          - inside:
              kind: mod_item
              stopBy: end
              follows:
                kind: attribute_item
                regex: 'cfg\(test\)'
          - inside:
              kind: struct_item
              stopBy: end
              follows:
                kind: attribute_item
                regex: 'cfg\(test\)'
                stopBy:
                  not:
                    kind: attribute_item
          - inside:
              kind: function_item
              stopBy: end
              follows:
                kind: attribute_item
                regex: 'cfg\(test\)'
                stopBy:
                  not:
                    kind: attribute_item
