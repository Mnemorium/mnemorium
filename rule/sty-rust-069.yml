---
id: sty-rust-069
language: Rust
severity: hint
message: extract outbound port trait declarations for STY-RUST-069
files:
  - src/lib/domain/port/**/*.rs
rule:
  any:
    - all:
        - kind: trait_item
        - any:
            - pattern: 'pub trait $TRAIT: $$$BOUNDS { $$$BODY }'
            - pattern: 'pub(crate) trait $TRAIT: $$$BOUNDS { $$$BODY }'
            - pattern: 'trait $TRAIT: $$$BOUNDS { $$$BODY }'
    - all:
        - kind: trait_item
        - any:
            - pattern: 'pub trait $TRAIT { $$$BODY }'
            - pattern: 'pub(crate) trait $TRAIT { $$$BODY }'
            - pattern: 'trait $TRAIT { $$$BODY }'
