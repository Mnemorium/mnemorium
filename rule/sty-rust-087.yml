---
id: sty-rust-087
language: Rust
severity: hint
message: >-
  extract every assertion-named function and every inline module, for
  STY-RUST-087
files:
  - src/**/*.rs
rule:
  any:
    - all:
        - kind: mod_item
        - has:
            kind: declaration_list
            stopBy: neighbor
        - has:
            field: name
            pattern: $MOD
            stopBy: neighbor
    - all:
        - kind: function_item
        - has:
            field: name
            regex: '^assert_'
            stopBy: neighbor
        - has:
            field: name
            pattern: $FN
            stopBy: neighbor
