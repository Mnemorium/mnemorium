---
id: sty-rust-089
language: Rust
severity: hint
message: >-
  extract every inline module and every function, for STY-RUST-089
files:
  - src/**/*.rs
rule:
  any:
    - all:
        - kind: mod_item
        - has:
            kind: declaration_list
            stopBy: neighbor
        - has:
            field: name
            pattern: $MOD
            stopBy: neighbor
    - all:
        - kind: function_item
        - has:
            field: name
            pattern: $FN
            stopBy: neighbor
