---
id: api-026
language: Rust
severity: error
message: >-
  a response declares a payload but no media type; add
  `content_type = "…"` to the response tuple
rule:
  kind: token_tree
  all:
    - inside:
        kind: attribute_item
        regex: '#\[utoipa::path'
        stopBy: end
    - inside:
        kind: token_tree
        follows:
          kind: identifier
          regex: "^responses$"
    - has:
        kind: identifier
        regex: "^body$"
        stopBy: end
    - not:
        has:
          kind: identifier
          regex: "^content_type$"
          stopBy: end
