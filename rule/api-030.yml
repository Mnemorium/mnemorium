---
id: api-030
language: Rust
severity: hint
message: >-
  extract the #[utoipa::path] response declaration, the ApiError mapping and the
  ApiError values a handler returns, for API-030
rule:
  all:
    - not:
        inside:
          kind: mod_item
          stopBy: end
          follows:
            kind: attribute_item
            regex: cfg\(test\)
    - any:
        - kind: attribute_item
          regex: '#\[utoipa::path'
        - kind: impl_item
          regex: 'for ApiError\b'
        - pattern: ApiError::$VARIANT
