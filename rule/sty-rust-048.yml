---
id: sty-rust-048
language: Rust
severity: error
message: >-
  a repository lookup reports a missing entity as a value: return
  Result<Option<...>, _>, never a bare aggregate
files:
  - src/lib/domain/port/*_repository.rs
rule:
  kind: function_signature_item
  has:
    field: name
    regex: '^(get|find)(_|$)'
  not:
    has:
      field: return_type
      regex: 'Result<\s*Option<'
