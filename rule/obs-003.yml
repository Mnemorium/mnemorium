---
id: obs-003
language: Rust
severity: hint
message: >-
  extract a non-test tracing log macro invocation for OBS-003
rule:
  all:
    - pattern: $MACRO!($$$ARGS)
    - not:
        inside:
          kind: mod_item
          stopBy: end
          follows:
            kind: attribute_item
            regex: cfg\(test\)
constraints:
  MACRO:
    regex: '^(tracing::)?(error|warn|info|debug|trace|event)$'
