---
id: api-023
language: Rust
severity: error
message: >-
  Response inside `responses(...)` declares no `status`; declare the HTTP
  status code.
files:
  - src/lib/infrastructure/inbound/rest/handler/**/*.rs
rule:
  all:
    - kind: token_tree
    - regex: '^\('
    - not:
        regex: '(?s)\bstatus\s*='
    - inside:
        kind: token_tree
        stopBy: neighbor
        follows:
          kind: identifier
          regex: '^responses$'
          stopBy: neighbor
