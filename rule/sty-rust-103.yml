---
id: sty-rust-103
language: Rust
severity: hint
message: >-
  extract the parameter tuples of a utoipa handler annotation, for STY-RUST-103
rule:
  kind: token_tree
  follows:
    kind: identifier
    regex: '^params$'
  inside:
    stopBy: end
    kind: attribute_item
    regex: '(?s)^#\[utoipa::path\s*\('
