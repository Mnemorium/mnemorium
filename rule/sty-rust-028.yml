---
id: sty-rust-028
language: Rust
severity: error
message: >-
  keep test setup inline: no helper `fn` nested inside another `fn`, and no
  module-level `static` in a `#[cfg(test)]` module (STY-RUST-028)
rule:
  any:
    # A helper function nested inside another function, in a test module.
    - all:
        - kind: function_item
        - inside:
            kind: function_item
            stopBy: end
        - inside:
            kind: mod_item
            stopBy: end
            follows:
              kind: attribute_item
              regex: 'cfg\(test\)'
              stopBy: end
    # A module-level `static` — distant global state, in a test module.
    - all:
        - kind: static_item
        - inside:
            kind: declaration_list
            stopBy: neighbor
            inside:
              kind: mod_item
              stopBy: end
              follows:
                kind: attribute_item
                regex: 'cfg\(test\)'
                stopBy: end
