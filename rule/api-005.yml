---
id: api-005
language: Rust
severity: error
message: >-
  declare the HTTP method (get/post/put/patch/delete) in #[utoipa::path(...)]
rule:
  all:
    - kind: attribute_item
      regex: '#\[utoipa::path'
    - not:
        has:
          stopBy: end
          any:
            - pattern: get
            - pattern: post
            - pattern: put
            - pattern: patch
            - pattern: delete
    - not:
        inside:
          kind: mod_item
          stopBy: end
          follows:
            kind: attribute_item
            regex: cfg\(test\)
