---
id: api-033
language: Rust
severity: hint
message: >-
  extract a HAL representation struct and its root fields, for API-033
rule:
  kind: struct_item
  has:
    kind: attribute_item
    regex: 'serde\([^)]*rename[[:space:]]*=[[:space:]]*"_links"'
    stopBy: end
  not:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: cfg\(test\)
