---
id: sty-rust-074
language: Rust
severity: hint
message: >-
  extract the logging install call and the LoadConfiguration startup binding
  for STY-RUST-074
files:
  - src/lib/app.rs
rule:
  any:
    # The single subscriber install site, through the infrastructure facade.
    - pattern: 'setup($$$ARGS)'
    # The composition root binds the LoadConfiguration use case before running it.
    - all:
        - pattern: 'let $VAR = $INIT;'
        - has:
            pattern: 'LoadConfiguration::new($$$ARGS)'
            stopBy: end
