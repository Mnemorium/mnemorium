---
id: test-035
language: Rust
severity: hint
message: >-
  a mockall mock of the wrapped repository in the moka cache adapter test
  module, for TEST-035
rule:
  all:
    - any:
        # The mockall-generated mock of a repository port (TEST-002): the
        # `Mock<Port>` type an `#[cfg_attr(test, mockall::automock)]` trait
        # yields. In a `use` path it is an `identifier`; in a type position a
        # `type_identifier`.
        - kind: type_identifier
          regex: '^Mock[A-Za-z0-9_]*Repository$'
        - kind: identifier
          regex: '^Mock[A-Za-z0-9_]*Repository$'
    # Only the adapter's test module counts: a mock name on the production side
    # is not a test double.
    - inside:
        kind: mod_item
        stopBy: end
        follows:
          kind: attribute_item
          regex: 'cfg\([^)]*\btest\b'
