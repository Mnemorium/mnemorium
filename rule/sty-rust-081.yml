---
id: sty-rust-081
language: Rust
severity: hint
message: extract the classic query signature and the domain models a repository port imports for STY-RUST-081
files:
  - src/lib/domain/port/*_repository.rs
rule:
  any:
    - all:
        - kind: function_signature_item
        - pattern: 'fn search($$$ARGS) -> impl Future<Output = Result<$RET, RepositoryError>> + Send;'
    - all:
        - kind: use_declaration
        - regex: '^use crate::domain::model::'
