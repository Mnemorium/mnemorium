---
id: sty-rust-052
language: Rust
severity: error
message: >-
  Declare the repository trait second in a repository port file: a
  non-`*Filter` struct must not precede the `<Aggregate>Repository` trait.
files:
  - src/lib/domain/port/*_repository.rs
rule:
  all:
    - kind: struct_item
    - any:
        - pattern: pub struct $NAME
        - pattern: pub(crate) struct $NAME
        - pattern: struct $NAME
    - inside:
        kind: source_file
    - not:
        regex: '(pub(\(crate\))? )?struct \w*Filter\b'
    - precedes:
        kind: trait_item
        any:
          - pattern: 'pub trait $TRAIT: Send + Sync'
          - pattern: 'pub(crate) trait $TRAIT: Send + Sync'
          - pattern: 'trait $TRAIT: Send + Sync'
        stopBy: end
