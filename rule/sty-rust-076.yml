---
id: sty-rust-076
language: Rust
severity: hint
message: >-
  extract the configuration paths the pre-pool bootstrap reads, for
  STY-RUST-076
files:
  - src/lib/infrastructure/outbound/config/bootstrap.rs
rule:
  any:
    - pattern: $RECEIVER.get_string($PATH)
    - pattern: $RECEIVER.get_int($PATH)
  not:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: 'cfg\(test\)'
