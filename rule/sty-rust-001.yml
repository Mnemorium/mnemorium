---
id: sty-rust-001
language: Rust
severity: hint
message: >-
  extract every production function declaration, for STY-RUST-001
files:
  - src/**/*.rs
rule:
  all:
    - kind: function_item
    - has:
        field: name
        pattern: $NAME
    - not:
        inside:
          any:
            - kind: mod_item
              follows:
                kind: attribute_item
                regex: cfg\(test\)
                stopBy: end
            - kind: function_item
              follows:
                kind: attribute_item
                regex: cfg\(test\)
                stopBy: end
          stopBy: end
