---
id: sty-rust-039
language: Rust
severity: hint
message: extract unit-of-work opener call sites for STY-RUST-039
rule:
  all:
    - any:
        - pattern: $RECV.begin()
        - pattern: $RECV.begin_write()
    - inside:
        kind: function_item
        pattern: $ENCLOSING
        has:
          field: name
          pattern: $FUNC
        stopBy: end
