---
id: sty-rust-056
language: Rust
severity: error
message: declare the command object first in a use-case port file
rule:
  all:
    - kind: struct_item
    - any:
        - pattern: pub struct $COMMAND
        - pattern: pub(crate) struct $COMMAND
        - pattern: struct $COMMAND
    - regex: '^(pub(\(crate\))? )?struct \w+Command\b'
    - follows:
        any:
          - kind: struct_item
          - kind: enum_item
          - kind: trait_item
        stopBy: end
