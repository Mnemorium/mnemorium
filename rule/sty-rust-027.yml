---
id: sty-rust-027
language: Rust
severity: error
message: >-
  a test function keeps control flow out of its body: no `if`, `match`, or loops
files:
  - src/**/*.rs
rule:
  kind: function_item
  all:
    # A test attribute precedes the function as a sibling, so `follows` — not
    # `has` — reaches it. `stopBy` the previous function keeps a non-test item
    # from inheriting its neighbour's #[test]; `stopBy: end` would cross that
    # boundary.
    - follows:
        kind: attribute_item
        regex: '#\[(rstest|([a-z0-9_]+::)*test)\b'
        stopBy:
          kind: function_item
    # Control flow in the test body, but not inside a closure: a closure is a
    # value the test passes (a mock's `returning` implementation, an iterator
    # adapter), not a branch the test takes.
    - has:
        stopBy: end
        all:
          - any:
              - kind: if_expression
              - kind: match_expression
              - kind: loop_expression
              - kind: while_expression
              - kind: for_expression
          - not:
              inside:
                kind: closure_expression
                stopBy: end
