---
id: sty-rust-029
language: Rust
severity: hint
message: >-
  extract every value-returning function and every inline module, for
  STY-RUST-029
files:
  - src/**/*.rs
rule:
  any:
    # An inline module: its attribute block — which the syntax tree cannot see —
    # tells a #[cfg(test)] module from production code.
    - all:
        - kind: mod_item
        - has:
            kind: declaration_list
            stopBy: neighbor
        - has:
            field: name
            pattern: $MOD
            stopBy: neighbor
    # A function that declares a return type: the only candidate for a builder helper.
    - all:
        - kind: function_item
        - has:
            field: name
            pattern: $FN
            stopBy: neighbor
        - has:
            field: parameters
            pattern: $PARAMS
            stopBy: neighbor
        - has:
            field: return_type
            pattern: $RET
            stopBy: neighbor
        # A method is not a fixture candidate: a fixture is injected, a method is called.
        - not:
            inside:
              kind: impl_item
              stopBy: end
